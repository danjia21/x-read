name: x-read

services:
  reader:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK}"
      - "traefik.http.services.x-read.loadbalancer.server.port=3000"
      - "traefik.http.routers.x-read.rule=Host(`${SITE_DOMAIN:?Set SITE_DOMAIN}`)"
      - "traefik.http.routers.x-read.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.x-read.service=x-read"
      - "traefik.http.routers.x-read.tls=true"
      - "traefik.http.routers.x-read.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
    name: ${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK}
