name: Reader verification
on:
  push:
    paths: ['site/**', '.github/workflows/reader-tests.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/reader-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npx playwright install --with-deps chromium webkit
        working-directory: site
      - run: npm run verify
        working-directory: site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-browser-results
          path: site/playwright-artifacts/e2e/
          retention-days: 7
